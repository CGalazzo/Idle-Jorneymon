    <meta name="description" content="Idle Jorneymon — uma jornada Pokémon automática." />
    <script>
      (() => {
        "use strict";

        const CLEANUP_VERSION = "20260726-4";
        const CLEANUP_KEY = "idleJorneymonFreshAssetsVersion";
        const REFRESH_PARAM = "__idle_refresh";
        const currentUrl = new URL(window.location.href);
        const alreadyRefreshed = currentUrl.searchParams.get(REFRESH_PARAM) === CLEANUP_VERSION;
        let alreadyClean = false;

        try {
          alreadyClean = window.localStorage.getItem(CLEANUP_KEY) === CLEANUP_VERSION;
        } catch {
          alreadyClean = false;
        }

        if (alreadyClean || alreadyRefreshed) {
          try {
            window.localStorage.setItem(CLEANUP_KEY, CLEANUP_VERSION);
          } catch {
            // O parâmetro da URL impede um ciclo de atualização quando o armazenamento está bloqueado.
          }

          if (alreadyRefreshed) {
            currentUrl.searchParams.delete(REFRESH_PARAM);
            window.history.replaceState(null, "", `${currentUrl.pathname}${currentUrl.search}${currentUrl.hash}`);
          }
          return;
        }

        // Interrompe esta primeira carga para nenhum módulo antigo iniciar antes da limpeza.
        window.stop();

        (async () => {
          try {
            if ("serviceWorker" in window.navigator) {
              const registrations = await window.navigator.serviceWorker.getRegistrations();
              await Promise.allSettled(registrations.map((registration) => registration.unregister()));
            }

            if ("caches" in window) {
              const names = await window.caches.keys();
              await Promise.allSettled(
                names
                  .filter((name) => name.startsWith("idle-jorneymon-"))
                  .map((name) => window.caches.delete(name))
              );
            }
          } finally {
            try {
              window.localStorage.setItem(CLEANUP_KEY, CLEANUP_VERSION);
            } catch {
              // O save permanece intacto; somente os arquivos temporários são limpos.
            }

            const refreshedUrl = new URL(window.location.href);
            refreshedUrl.searchParams.set(REFRESH_PARAM, CLEANUP_VERSION);
            window.location.replace(refreshedUrl.toString());
          }
        })();
      })();
    </script>
